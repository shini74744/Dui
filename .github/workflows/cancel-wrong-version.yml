name: Cancel Wrong Dui Version

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove v25.11.31 remnants
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v25.11.31 --repo "$GITHUB_REPOSITORY" --cleanup-tag -y >/dev/null 2>&1 || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v25.11.31" >/dev/null 2>&1 || true
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.head_branch=="v25.11.31") | .id' | while read -r id; do
            [ -n "$id" ] || continue
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
          done
