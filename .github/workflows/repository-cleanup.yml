name: Dui Repository Cleanup

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove previous releases, tags and workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cleaning previous releases..."
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y || true
          done

          echo "Cleaning leftover tags..."
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref' | while read -r ref; do
            [ -n "$ref" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/${ref#refs/}" || true
          done

          echo "Cleaning previous workflow runs..."
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --jq '.workflow_runs[].id' | while read -r id; do
            [ -n "$id" ] || continue
            if [ "$id" != "$GITHUB_RUN_ID" ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null 2>&1 || true
              sleep 1
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1 || true
            fi
          done

          echo "Dui repository cleanup complete."
