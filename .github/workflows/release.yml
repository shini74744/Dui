name: Build and Release Dui

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n x-ui.sh
          bash -n web/service/fb5.sh
          bash -n web/service/ntp.sh
          sh -n web/service/ddns.sh
          sh -n DockerInit.sh
          bash -n core/xray/prepare.sh core/xray/build.sh
      - name: User rate and TLS form round trips
        run: |
          node scripts/test-user-rate.cjs
          node scripts/test-native-protocols.cjs
          node scripts/test-helper-protocols.cjs
          node scripts/test-close-wait.cjs
          node scripts/test-outbound-references.cjs
          node scripts/test-strategy-probes.cjs
      - name: Menu updater regression guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^install\(\)' x-ui.sh; then
            echo 'x-ui.sh must not define install(); it shadows the coreutils install command.'
            exit 1
          fi
          grep -Eq '^install_panel\(\)' x-ui.sh
          grep -Eq '^install_menu_script_atomic\(\)' x-ui.sh
          grep -Eq '^install_menu_script_atomic\(\)' install.sh
          if grep -Eq 'install -m .* /usr/bin/x-ui([[:space:]]|$)' x-ui.sh install.sh; then
            echo 'Direct in-place writes to /usr/bin/x-ui are forbidden; use atomic replacement.'
            exit 1
          fi
      - name: Go tests
        run: go test ./...
      - name: Verified updater race checks
        run: go test -race ./internal/update
      - name: Updater layout and progress tests
        shell: bash
        run: |
          npm install --prefix /tmp/dui-updater-ui playwright
          /tmp/dui-updater-ui/node_modules/.bin/playwright install --with-deps chromium
          PLAYWRIGHT_MODULE=/tmp/dui-updater-ui/node_modules/playwright node scripts/test-updates-ui.cjs

  test-docker:
    name: Docker amd64 smoke test
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build complete Docker image
        run: docker build --build-arg TARGETARCH=amd64 -t dui-ci:${{ github.sha }} .
      - name: Verify bundled programs and isolated startup
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='dui-ci:${{ github.sha }}'
          EXPECTED_PANEL=$(cat config/version)
          source core/xray/default.env
          docker run --rm --network none --env EXPECTED_PANEL="$EXPECTED_PANEL" --env EXPECTED_CORE="$XRAY_TAG" --entrypoint /bin/sh "$IMAGE" -c '
            set -e
            test "$(./x-ui -v)" = "$EXPECTED_PANEL"
            ./bin/xray-linux-amd64 version | grep -F "Xray $EXPECTED_CORE "
            ./bin/tuic-server-linux-amd64 --version
            ./bin/mtg-linux-amd64 --version
            test -s ./bin/helpers-BUILD.json
          '
          trap 'docker rm -fv dui-ci-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name dui-ci-smoke --network none -e XUI_ENABLE_FAIL2BAN=false --entrypoint /bin/sh "$IMAGE" -c '
            ./x-ui setting -port 2053 -listenIP 127.0.0.1 -webBasePath / >/dev/null 2>&1
            exec /app/DockerEntrypoint.sh
          '
          for attempt in $(seq 1 30); do
            if docker exec dui-ci-smoke wget -q -O - http://127.0.0.1:2053/ > /tmp/dui-login.html && grep -qi "<html" /tmp/dui-login.html; then
              docker exec dui-ci-smoke pgrep -f '^([^ ]*/)?xray-linux-amd64( |$)'
              echo "Docker panel HTTP, core and bundled helper checks passed"
              exit 0
            fi
            sleep 1
          done
          echo "Docker panel did not become healthy"
          exit 1

  build-linux:
    name: Linux ${{ matrix.platform }}
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vx-'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64, armv7, armv6, armv5, 386, s390x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y curl xz-utils file unzip wget
      - name: Configure cross compiler
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            amd64) BOOTLIN_ARCH='x86-64'; GOARCH_VALUE='amd64'; GOARM_VALUE='' ;;
            arm64) BOOTLIN_ARCH='aarch64'; GOARCH_VALUE='arm64'; GOARM_VALUE='' ;;
            armv7) BOOTLIN_ARCH='armv7-eabihf'; GOARCH_VALUE='arm'; GOARM_VALUE='7' ;;
            armv6) BOOTLIN_ARCH='armv6-eabihf'; GOARCH_VALUE='arm'; GOARM_VALUE='6' ;;
            armv5) BOOTLIN_ARCH='armv5-eabi'; GOARCH_VALUE='arm'; GOARM_VALUE='5' ;;
            386) BOOTLIN_ARCH='x86-i686'; GOARCH_VALUE='386'; GOARM_VALUE='' ;;
            s390x) BOOTLIN_ARCH='s390x-z13'; GOARCH_VALUE='s390x'; GOARM_VALUE='' ;;
          esac

          BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/${BOOTLIN_ARCH}/tarballs/"
          FILE=$(curl -fsSL "$BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\.tar\.xz" | sort -Vr | head -n1)
          test -n "$FILE"
          curl -fL --retry 3 -o "/tmp/$FILE" "$BASE$FILE"
          tar -xJf "/tmp/$FILE" -C /tmp
          TOOLCHAIN_DIR=$(find /tmp -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          test -n "$TOOLCHAIN_DIR"
          CC_BIN=$(find "$TOOLCHAIN_DIR/bin" -type f -name '*-gcc.br_real' -perm -111 | head -n1)
          test -n "$CC_BIN"
          echo "GOOS=linux" >> "$GITHUB_ENV"
          echo "GOARCH=$GOARCH_VALUE" >> "$GITHUB_ENV"
          echo "GOARM=$GOARM_VALUE" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CC=$CC_BIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Build static x-ui
        run: |
          set -euo pipefail
          go build -trimpath -ldflags="-s -w -linkmode external -extldflags '-static'" -o x-ui-bin .
          file x-ui-bin

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p x-ui/bin
          install -m 0755 x-ui-bin x-ui/x-ui
          install -m 0755 x-ui.sh x-ui/x-ui.sh
          install -m 0644 x-ui.service x-ui/x-ui.service
          install -m 0755 web/service/fb5.sh x-ui/fb5.sh

          source core/xray/default.env
          XRAY_BASE="https://github.com/$XRAY_REPO/releases/download/$XRAY_TAG"
          case '${{ matrix.platform }}' in
            amd64) XRAY_ZIP='Xray-linux-64.zip' ;;
            arm64) XRAY_ZIP='Xray-linux-arm64-v8a.zip' ;;
            armv7) XRAY_ZIP='Xray-linux-arm32-v7a.zip' ;;
            armv6) XRAY_ZIP='Xray-linux-arm32-v6.zip' ;;
            armv5) XRAY_ZIP='Xray-linux-arm32-v5.zip' ;;
            386) XRAY_ZIP='Xray-linux-32.zip' ;;
            s390x) XRAY_ZIP='Xray-linux-s390x.zip' ;;
          esac

          curl -fL --retry 3 "$XRAY_BASE/$XRAY_ZIP" -o /tmp/xray.zip
          curl -fL --retry 3 "$XRAY_BASE/$XRAY_ZIP.sha256" -o /tmp/xray.sha256
          XRAY_HASH=$(awk '{print $1}' /tmp/xray.sha256)
          printf '%s  /tmp/xray.zip\n' "$XRAY_HASH" | sha256sum -c -
          unzip -q /tmp/xray.zip -d /tmp/xray
          install -m 0755 /tmp/xray/xray "x-ui/bin/xray-linux-${GOARCH}"
          install -m 0644 /tmp/xray/LICENSE x-ui/bin/xray-LICENSE
          install -m 0644 /tmp/xray/BUILD.json x-ui/bin/xray-BUILD.json

          python3 core/helpers/assemble.py --platform '${{ matrix.platform }}' --output x-ui/bin

          curl -fL --retry 3 https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat -o x-ui/bin/geoip.dat
          curl -fL --retry 3 https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat -o x-ui/bin/geosite.dat
          curl -fL --retry 3 https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat -o x-ui/bin/geoip_IR.dat
          curl -fL --retry 3 https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat -o x-ui/bin/geosite_IR.dat
          curl -fL --retry 3 https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat -o x-ui/bin/geoip_RU.dat
          curl -fL --retry 3 https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat -o x-ui/bin/geosite_RU.dat

          tar -czf "x-ui-linux-${{ matrix.platform }}.tar.gz" x-ui
          sha256sum "x-ui-linux-${{ matrix.platform }}.tar.gz" > "x-ui-linux-${{ matrix.platform }}.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            x-ui-linux-${{ matrix.platform }}.tar.gz
            x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vx-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          count=$(find release-assets -maxdepth 1 -type f | wc -l)
          echo "release asset count: $count"
          test "$count" -eq 14
          ls -lh release-assets

      - name: Publish Dui release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
