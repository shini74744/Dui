{{define "modals/balancerModal"}}
<a-modal 
    id="balancer-modal"
    v-model="balancerModal.visible"
    :title="balancerModal.title"
    @ok="balancerModal.ok"
    :confirm-loading="balancerModal.confirmLoading"
    :width="balancerModal.balancer.strategy === 'priority' ? 680 : 520"
    :ok-button-props="{ props: { disabled: !balancerModal.isValid } }"
    :closable="true"
    :mask-closable="false"
    :ok-text="balancerModal.okText"
    cancel-text='{{ i18n "close" }}'
    :class="themeSwitcher.currentTheme">
    <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
        <a-form-item label='{{ i18n "pages.xray.balancer.tag" }}' has-feedback
            :validate-status="balancerModal.duplicateTag? 'warning' : 'success'">
            <a-input v-model.trim="balancerModal.balancer.tag" @change="balancerModal.check()"
                placeholder='{{ i18n "pages.xray.balancer.tagDesc" }}'></a-input>
        </a-form-item>
        <a-form-item label='{{ i18n "pages.xray.balancer.balancerStrategy" }}'>
            <a-select v-model="balancerModal.balancer.strategy" @change="balancerModal.checkSelector()" :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="option in balancerModal.strategyOptions(true)" :key="option.value" :value="option.value">[[ option.label ]]</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item v-if="balancerModal.balancer.strategy !== 'priority'" label='{{ i18n "pages.xray.balancer.balancerSelectors" }}' has-feedback
            :validate-status="balancerModal.emptySelector? 'warning' : 'success'">
            <a-select v-model="balancerModal.balancer.selector" mode="tags" @change="balancerModal.checkSelector()"
                :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="tag in balancerModal.outboundTags" :value="tag">[[ tag ]]</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item label="Fallback" v-if="balancerModal.balancer.strategy !== 'priority'">
            <a-select v-model="balancerModal.balancer.fallbackTag" clearable
                :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="tag in [ '', ...balancerModal.outboundTags]" :value="tag">[[ tag ]]</a-select-option>
            </a-select>
        </a-form-item>
        <div v-if="balancerModal.balancer.strategy === 'priority'" class="dui-priority-editor">
            <p class="dui-priority-help">[[ balancerModal.text().priorityHelp ]]</p>
            <div v-for="(level,index) in balancerModal.balancer.levels" :key="index" class="dui-priority-level">
                <div class="dui-priority-heading">
                    <strong>[[ balancerModal.text().level ]] [[ index + 1 ]]</strong>
                    <div class="dui-priority-tools">
                        <a-button icon="arrow-up" :title="balancerModal.text().up" :aria-label="balancerModal.text().up" :disabled="index===0" @click="balancerModal.moveLevel(index,-1)"></a-button>
                        <a-button icon="arrow-down" :title="balancerModal.text().down" :aria-label="balancerModal.text().down" :disabled="index===balancerModal.balancer.levels.length-1" @click="balancerModal.moveLevel(index,1)"></a-button>
                        <a-button icon="delete" :title="balancerModal.text().remove" :aria-label="balancerModal.text().remove" :disabled="balancerModal.balancer.levels.length===1" @click="balancerModal.balancer.levels.splice(index,1);balancerModal.checkSelector()"></a-button>
                    </div>
                </div>
                <a-form-item label='{{ i18n "pages.xray.balancer.balancerStrategy" }}'>
                    <a-select v-model="level.strategy.type" :dropdown-class-name="themeSwitcher.currentTheme">
                        <a-select-option v-for="option in balancerModal.strategyOptions()" :key="option.value" :value="option.value">[[ option.label ]]</a-select-option>
                    </a-select>
                </a-form-item>
                <a-form-item label='{{ i18n "pages.xray.balancer.balancerSelectors" }}' :validate-status="balancerModal.emptySelector && !level.selector.length ? 'warning' : ''">
                    <a-select v-model="level.selector" mode="multiple" @change="balancerModal.checkSelector()" :dropdown-class-name="themeSwitcher.currentTheme">
                        <a-select-option v-for="tag in balancerModal.probeTags" :key="tag" :value="tag">[[ tag ]]</a-select-option>
                    </a-select>
                </a-form-item>
            </div>
            <a-button icon="plus" :disabled="balancerModal.balancer.levels.length>=10" @click="balancerModal.addLevel()">[[ balancerModal.text().addLevel ]]</a-button>
            <p v-if="balancerModal.emptySelector" class="dui-priority-help" role="alert">[[ balancerModal.text().levelRequired ]]</p>
        </div>
    </a-form>
</a-modal>
<style>
.dui-priority-help {font-size:12px;line-height:1.8;opacity:.75;margin:0 0 14px;overflow-wrap:anywhere}
.dui-priority-level {padding:16px;border:1px solid rgba(128,128,128,.25);border-radius:12px;margin-bottom:12px}
.dui-priority-heading {display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dui-priority-tools {display:flex;gap:6px}
.dui-priority-tools .ant-btn[disabled] {opacity:.35}
.dui-priority-level .ant-form-item {margin-bottom:12px}
.dui-priority-level .ant-select {width:100%;min-width:0}
.dui-priority-level .ant-select-selection__choice {max-width:100%}
@media(max-width:575px) {
 #balancer-modal .ant-modal {max-width:calc(100vw - 24px);margin:12px auto;top:12px;padding-bottom:12px}
 #balancer-modal .ant-modal-body {padding:16px}
 .dui-priority-level {padding:12px}
 .dui-priority-level .ant-form-item-label {line-height:1.6;padding-bottom:6px}
}
</style>
<script>
    const balancerModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        confirm: null,
        isValid: false,
        probeTags: [],
        duplicateTag: false,
        emptySelector: false,
        balancer: {
            tag: '',
            strategy: 'random',
            selector: [],
            fallbackTag: '',
            levels: [{selector:[],strategy:{type:'roundRobin'}},{selector:[],strategy:{type:'roundRobin'}}]
        },
        outboundTags: [],
        balancerTags:[],
        ok() {
            balancerModal.checkSelector();
            if (balancerModal.emptySelector) {
                balancerModal.emptySelector = true;
                return;
            }
            balancerModal.emptySelector = false;
            ObjectUtil.execute(balancerModal.confirm, balancerModal.balancer);
        },
        show({ title = '', okText = '{{ i18n "sure" }}', balancerTags = [], balancer, confirm = (balancer) => { }, isEdit = false }) {
            this.title = title;
            this.okText = okText;
            this.confirm = confirm;
            this.visible = true;
            if (isEdit) {
                balancerModal.balancer = DuiStrategyProbes.clone(balancer);
                if (!this.balancer.levels.length) this.balancer.levels = [{selector:[],strategy:{type:"roundRobin"}}];
            } else {
                balancerModal.balancer = {
                    tag: '',
                    strategy: 'random',
                    selector: [],
                    fallbackTag: '',
            levels: [{selector:[],strategy:{type:'roundRobin'}},{selector:[],strategy:{type:'roundRobin'}}]
                };
            }
            this.balancerTags = balancerTags.filter((tag) => !isEdit || tag != balancer.tag);
            this.probeTags = DuiStrategyProbes.probeable(app.templateSettings);
            this.outboundTags = app.templateSettings.outbounds.filter((o) => !ObjectUtil.isEmpty(o.tag) && !String(o.tag).startsWith('__dui_blacklist_')).map(obj => obj.tag);
            this.isEdit = isEdit;
            this.check();
            this.checkSelector();
        },
        close() {
            this.visible = false;
            this.loading(false);
        },
        loading(loading=true) {
            this.confirmLoading = loading;
        },
        check() {
            if (this.balancer.tag == '' || this.balancerTags.includes(this.balancer.tag)) {
                this.duplicateTag = true;
                this.isValid = false;
            } else {
                this.duplicateTag = false;
                this.isValid = true;
            }
        },
        checkSelector() {
            this.emptySelector = this.balancer.strategy === "priority" ? this.balancer.levels.some(l => !l.selector.length) : this.balancer.selector.length == 0;
        },
        text() {return DuiProbeI18n.get(LanguageManager.getLanguage())},
        addLevel() {this.balancer.levels.push({selector:[],strategy:{type:'roundRobin'}});this.checkSelector()},
        moveLevel(index, delta) {
            const target=index+delta;
            if(target<0 || target>=this.balancer.levels.length)return;
            this.balancer.levels.splice(target,0,this.balancer.levels.splice(index,1)[0]);
        },
        strategyOptions(includePriority = false) {
            const lang = (() => { try { return LanguageManager.getLanguage() || 'en-US'; } catch (e) { return 'en-US'; } })();
            const maps = {
                'zh-CN': { random:'随机', roundRobin:'轮询', leastLoad:'最低负载', leastPing:'最低延迟' },
                'zh-TW': { random:'隨機', roundRobin:'輪詢', leastLoad:'最低負載', leastPing:'最低延遲' },
                'en-US': { random:'Random', roundRobin:'Round Robin', leastLoad:'Least Load', leastPing:'Least Ping' },
                'ja-JP': { random:'ランダム', roundRobin:'ラウンドロビン', leastLoad:'最小負荷', leastPing:'最低遅延' },
                'ru-RU': { random:'Случайно', roundRobin:'По кругу', leastLoad:'Мин. нагрузка', leastPing:'Мин. задержка' },
                'vi-VN': { random:'Ngẫu nhiên', roundRobin:'Luân phiên', leastLoad:'Tải thấp nhất', leastPing:'Độ trễ thấp nhất' },
                'es-ES': { random:'Aleatorio', roundRobin:'Round Robin', leastLoad:'Menor carga', leastPing:'Menor latencia' },
                'id-ID': { random:'Acak', roundRobin:'Round Robin', leastLoad:'Beban terendah', leastPing:'Latensi terendah' },
                'uk-UA': { random:'Випадково', roundRobin:'По колу', leastLoad:'Мін. навантаження', leastPing:'Мін. затримка' },
                'tr-TR': { random:'Rastgele', roundRobin:'Sıralı', leastLoad:'En düşük yük', leastPing:'En düşük gecikme' },
                'pt-BR': { random:'Aleatório', roundRobin:'Round Robin', leastLoad:'Menor carga', leastPing:'Menor latência' },
                'ar-EG': { random:'عشوائي', roundRobin:'دوري', leastLoad:'أقل حمل', leastPing:'أقل زمن انتقال' },
                'fa-IR': { random:'تصادفی', roundRobin:'چرخشی', leastLoad:'کمترین بار', leastPing:'کمترین تأخیر' }
            };
            const map = maps[lang] || maps['en-US'];
            return ['random','roundRobin','leastLoad','leastPing', ...(includePriority ? ['priority'] : [])].map(value => ({ value, label: this.text()[value] || map[value] || value }));
        }
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#balancer-modal',
        data: {
            balancerModal: balancerModal
        },
        methods: {
        }
    });

</script>
{{end}}
