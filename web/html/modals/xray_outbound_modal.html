{{define "modals/outModal"}}
<a-modal id="out-modal" v-model="outModal.visible" :title="outModal.title" @ok="outModal.ok()"
         :confirm-loading="outModal.confirmLoading" :closable="true" :mask-closable="false"
         :ok-button-props="{ props: { disabled: !outModal.isValid } }" :style="{ overflow: 'hidden' }"
         :ok-text="outModal.okText" cancel-text='{{ i18n "close" }}' :class="themeSwitcher.currentTheme">
         <template slot="footer">
             <div v-if="outModal.isEdit && outModal.references.total > 0" style="text-align: left; margin-bottom: 12px; overflow-wrap: anywhere;">
                 <div>已有 [[ outModal.references.routes.length ]] 条路由引用<span v-if="outModal.references.total > outModal.references.routes.length">，另有 [[ outModal.references.total - outModal.references.routes.length ]] 处关联引用</span>。“同步保存”会一并更新。</div>
                 <div>弹窗确认后，仍需点击页面“保存”才会生效。</div>
                 <div v-if="outModal.previousTags.length > 0">还有未同步的旧标签引用，点击“同步保存”可一并更新。</div>
                 <a-alert v-if="outModal.originalTag !== outbound.tag || outModal.previousTags.length > 0" type="info" show-icon style="margin-top: 8px;">
                     <span slot="message" :style="{ color: themeSwitcher.currentTheme === 'dark' ? '#e8e8e8' : undefined }">普通“确定”不更新路由引用，可稍后重新编辑并“同步保存”。</span>
                 </a-alert>
                 <a-alert v-if="outModal.referenceError" type="warning" show-icon style="margin-top: 8px;">
                     <span slot="message" :style="{ color: themeSwitcher.currentTheme === 'dark' ? '#e8e8e8' : undefined }">[[ outModal.referenceError ]]</span>
                 </a-alert>
             </div>
             <div style="display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px;">
                 <a-button @click="outModal.close()">{{ i18n "close" }}</a-button>
                 <a-button :type="outModal.isEdit && outModal.references.total > 0 ? 'default' : 'primary'" :disabled="!outModal.isValid" :loading="outModal.confirmLoading" @click="outModal.ok()">[[ outModal.okText ]]</a-button>
                 <a-button v-if="outModal.isEdit && outModal.references.total > 0" type="primary" :disabled="!outModal.isValid || !!outModal.referenceError" :loading="outModal.confirmLoading" @click="outModal.ok('sync')">同步保存</a-button>
             </div>
         </template>
         {{template "form/outbound"}}
</a-modal>
<script>

    const outModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        confirm: null,
        outbound: new Outbound(),
        jsonMode: false,
        link: '',
        cm: null,
        duplicateTag: false,
        isValid: true,
        activeKey: '1',
        tags: [],
        originalTag: '',
        referenceSettings: null,
        previousTags: [],
        outboundIndex: -1,
        references: { routes: [], balancers: 0, observatories: 0, chains: 0, total: 0 },
        referenceError: '',
        ok(mode = 'replace') {
            outModal.check();
            if (!outModal.isValid || (mode === 'sync' && outModal.referenceError)) return;
            ObjectUtil.execute(outModal.confirm, outModal.outbound.toJson(), mode);
        },
        show({ title='', okText='{{ i18n "sure" }}', outbound, confirm=(outbound)=>{}, isEdit=false, tags=[], referenceSettings=null, previousTags=[], outboundIndex=-1 }) {
            this.title = title;
            this.okText = okText;
            this.confirm = confirm;
            this.jsonMode = false;
            this.link = '';
            this.activeKey = '1';
            this.visible = true;
            this.outbound = isEdit ? Outbound.fromJson(outbound) : new Outbound();
            this.isEdit = isEdit;
            this.tags = tags;
            this.originalTag = isEdit ? String(outbound.tag || '') : '';
            this.referenceSettings = referenceSettings;
            this.outboundIndex = outboundIndex;
            this.previousTags = previousTags.slice();
            this.references = DuiOutboundReferences.inspect(referenceSettings, [this.originalTag, ...this.previousTags]);
            this.referenceError = '';
            this.check()
        },
        close() {
            outModal.visible = false;
            outModal.loading(false);
        },
        loading(loading=true) {
            outModal.confirmLoading = loading;
        },
        check(){
            const tag = String(outModal.outbound.tag || '').trim();
            this.duplicateTag = !tag || outModal.tags.some(value => String(value || '').trim() === tag);
            this.referenceError = '';
            if (!this.duplicateTag && this.isEdit && this.referenceSettings) {
                try {
                    DuiOutboundReferences.prepare(this.referenceSettings, this.outboundIndex, this.outbound.toJson(), 'sync', this.previousTags);
                } catch (error) {
                    this.referenceError = error.message;
                }
            }
            this.isValid = !this.duplicateTag && !tag.startsWith('__dui_blacklist_');
        },
        toggleJson(jsonTab) {
            textAreaObj = document.getElementById('outboundJson');
            if(jsonTab){
                if(this.cm != null) {
                        this.cm.toTextArea();
                        this.cm=null;
                }
                textAreaObj.value = JSON.stringify(this.outbound.toJson(), null, 2);
                this.cm = CodeMirror.fromTextArea(textAreaObj, app.cmOptions);
                this.cm.on('change',editor => {
                    value = editor.getValue();
                    if(this.isJsonString(value)){
                        this.outbound = Outbound.fromJson(JSON.parse(value));
                        this.check();
                    }
                });
                this.activeKey = '2';
            } else {
                if(this.cm != null) {
                        this.cm.toTextArea();
                        this.cm=null;
                }
                this.activeKey = '1';
            }
        },
        isJsonString(str) {
            try {
                JSON.parse(str);
            } catch (e) {
                return false;
            }
            return true;
        },
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#out-modal',
        data: {
            outModal: outModal,
            get outbound() {
                return outModal.outbound;
            },
        },
        methods: {
            streamNetworkChange() {
                if (this.outModal.outbound.protocol == Protocols.VLESS && !outModal.outbound.canEnableTlsFlow()) {
                    delete this.outModal.outbound.settings.flow;
                }
            },
            canEnableTls() {
                return this.outModal.outbound.canEnableTls();
            },
            convertLink(){
                newOutbound = Outbound.fromLink(outModal.link);
                if(newOutbound){
                    this.outModal.outbound = newOutbound;
                    this.outModal.toggleJson(true);
                    this.outModal.check();
                    this.$message.success('Link imported successfully...');      
                    outModal.link = '';
                } else {
                    this.$message.error('Wrong Link!');
                    outModal.link = '';
                }
            },
        },
    });

</script>
{{end}}
