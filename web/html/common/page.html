<!DOCTYPE html>

    [v-cloak] {
      display: none;
    }
    /* vazirmatn-regular - arabic_latin_latin-ext */
    @font-face {
      font-display: swap;
      font-family: 'Vazirmatn';
      font-style: normal;
      font-weight: 400;
      src: url('{{ .base_path }}assets/Vazirmatn-UI-NL-Regular.woff2') format('woff2');

  <script>
    (function () {
      try {
        if (localStorage.getItem('dui-ui-theme') === 'starry') {
          document.documentElement.setAttribute('data-dui-ui', 'starry');
        }
      } catch (_) {}
    })();
  </script>
  <style id="starry-global-styles">
    html[data-dui-ui="starry"] body {
      background:
        radial-gradient(ellipse at 18% 8%, rgba(64, 93, 220, .16) 0, transparent 34%),
        radial-gradient(ellipse at 82% 18%, rgba(22, 163, 196, .10) 0, transparent 28%),
        radial-gradient(ellipse at 62% 92%, rgba(117, 67, 183, .12) 0, transparent 36%),
        linear-gradient(145deg, #030713 0%, #07101f 45%, #080b1a 100%) !important;
      color: #dce7f8;
    }
    html[data-dui-ui="starry"] body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .68;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.82) 0 1px, transparent 1.3px),
        radial-gradient(circle, rgba(125,211,252,.62) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(196,181,253,.56) 0 1.1px, transparent 1.5px);
      background-size: 118px 118px, 173px 173px, 251px 251px;
      background-position: 10px 18px, 61px 39px, 104px 71px;
      animation: duiStarDrift 120s linear infinite;
    }
    html[data-dui-ui="starry"] body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(118deg, transparent 0 48.8%, rgba(255,255,255,.45) 49.5%, rgba(125,211,252,.22) 50.1%, transparent 51.2%) no-repeat;
      background-size: 240% 240%;
      animation: duiMeteor 18s ease-in-out infinite;
    }
    @keyframes duiStarDrift {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(-118px,59px,0); }
    }
    @keyframes duiMeteor {
      0%, 76%, 100% { background-position: 180% -90%; opacity: 0; }
      79% { opacity: .42; }
      86% { background-position: -90% 180%; opacity: 0; }
    }
    html[data-dui-ui="starry"] #app,
    html[data-dui-ui="starry"] #content-layout,
    html[data-dui-ui="starry"] .ant-layout,
    html[data-dui-ui="starry"] .ant-layout-content {
      position: relative;
      z-index: 1;
      background: transparent !important;
    }
    html[data-dui-ui="starry"] .ant-sidebar > .ant-layout-sider,
    html[data-dui-ui="starry"] .ant-layout-sider,

      color: #cad7ed !important;

      -webkit-backdrop-filter: blur(16px);
    }
    html[data-dui-ui="starry"] .ant-sidebar > .ant-layout-sider {
      border-right: 1px solid rgba(112, 145, 210, .13) !important;
      box-shadow: 12px 0 44px rgba(0,0,0,.18);
    }
    html[data-dui-ui="starry"] .ant-menu-item,
    html[data-dui-ui="starry"] .ant-menu-submenu-title,
    html[data-dui-ui="starry"] .ant-layout-sider-trigger {

    html[data-dui-ui="starry"] .ant-menu-item .anticon,
    html[data-dui-ui="starry"] .ant-menu-submenu-title .anticon {
      color: #8fa6c9 !important;
    }
    html[data-dui-ui="starry"] .ant-menu:not(.ant-menu-horizontal) .ant-menu-item-selected {
      color: #f4f7ff !important;
      background: linear-gradient(100deg, rgba(55,91,184,.88), rgba(92,65,168,.78)) !important;

    html[data-dui-ui="starry"] .ant-menu-item-selected .anticon {

    html[data-dui-ui="starry"] .ant-menu-item:hover,
    html[data-dui-ui="starry"] .ant-menu-submenu-title:hover {
      color: #eef4ff !important;
      background: rgba(73,102,163,.16) !important;
    }
    html[data-dui-ui="starry"] .ant-card,
    html[data-dui-ui="starry"] .glass-card,
    html[data-dui-ui="starry"] .ant-tabs,
    html[data-dui-ui="starry"] .ant-collapse,

    html[data-dui-ui="starry"] .ant-list-bordered {

    html[data-dui-ui="starry"] .ant-table-thead > tr > th,

    html[data-dui-ui="starry"] .ant-btn:not(.ant-btn-danger) {

    }
    html[data-dui-ui="starry"] .ant-btn-primary {

      border-color: rgba(135,169,233,.36) !important;

    }
    html[data-dui-ui="starry"] .ant-tag {
      color: #dce9fb !important;
      background: rgba(13,28,56,.76) !important;
      border-color: rgba(105,151,222,.24) !important;
    }
    html[data-dui-ui="starry"] .dui-logo-text {
      color: #f4f7ff !important;
      text-shadow: 0 0 16px rgba(143,181,255,.28), 0 0 38px rgba(115,84,190,.18) !important;

    html[data-dui-ui="starry"] .dui-desc,

    html[data-dui-ui="starry"] .ant-modal-content,

    html[data-dui-ui="starry"] .ant-modal-title,

    @media (prefers-reduced-motion: reduce) {
      html[data-dui-ui="starry"] body::before,
      html[data-dui-ui="starry"] body::after { animation: none !important; }
    }

    /* 提示层可读性：白天 / 黑夜 / 星空统一增强 */
