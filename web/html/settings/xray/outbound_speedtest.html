{{define "settings/xray/outboundSpeedTestComponent"}}
<style>
.dui-speed { width:100%; min-width:0; margin:4px 0 16px; }
.dui-speed-panel { margin-top:14px; padding:20px; border:1px solid rgba(128,128,128,.22); border-radius:16px; }
.dui-speed-head,.dui-speed-heading,.dui-speed-results-head { display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
.dui-speed-head { justify-content:space-between; margin-bottom:8px; }
.dui-speed-heading h3 { margin:0; color:inherit; font-size:15px; font-weight:600; }
.dui-speed-hint { opacity:.7; font-size:12px; line-height:1.8; overflow-wrap:anywhere; }
.dui-speed-head + .dui-speed-hint { margin:0 0 18px; }
.dui-speed-fields { display:grid; grid-template-columns:minmax(240px,1fr) minmax(180px,auto) 104px auto; gap:16px; align-items:end; }
.dui-speed-field { min-width:0; }
.dui-speed-field > label { display:block; margin-bottom:8px; font-size:12px; font-weight:500; }
.dui-speed-field .ant-select { width:100%; }
.dui-speed-field .ant-select-selection { min-height:38px; }
.dui-speed-field .ant-select-selection--single .ant-select-selection__rendered { line-height:36px; }
.dui-speed-field .ant-select-selection--multiple .ant-select-selection__rendered { margin-top:3px; }
.dui-speed-field .ant-select-selection__choice { max-width:calc(100% - 8px); }
.dui-speed-mode.ant-radio-group { display:flex; min-height:38px; padding:3px; border:1px solid rgba(128,128,128,.24); border-radius:22px; gap:3px; background:rgba(128,128,128,.04); }
.dui-speed-mode .ant-radio-button-wrapper { flex:1; height:auto; min-height:30px; line-height:30px; padding:0 14px; text-align:center; white-space:normal; border:0 !important; border-radius:18px !important; color:inherit !important; background:transparent !important; box-shadow:none !important; }
.dui-speed-mode .ant-radio-button-wrapper:before { display:none !important; }
.dui-speed-mode .ant-radio-button-wrapper-checked { color:#fff !important; background:#008771 !important; }
.dui-speed-mode .ant-radio-button-wrapper-disabled { opacity:.55; }
.dark .dui-speed-mode .ant-radio-button-wrapper:not(.ant-radio-button-wrapper-checked) { color:rgba(255,255,255,.78) !important; }
.dui-speed-actions { display:flex; gap:8px; flex-wrap:wrap; }
.dui-speed-actions .ant-btn { height:38px; }
.dui-speed-actions .ant-btn-primary:not([disabled]) { background:#008771 !important; border-color:#008771 !important; color:#fff !important; }
.dui-speed-selection-note { display:flex; gap:6px 14px; flex-wrap:wrap; margin-top:8px; }
.dui-speed-selection-count { font-variant-numeric:tabular-nums; }
.dui-speed-results-section { margin-top:20px; padding-top:16px; border-top:1px solid rgba(128,128,128,.18); }
.dui-speed-results-head { justify-content:space-between; margin-bottom:12px; }
.dui-speed-results-head strong { font-size:13px; font-weight:500; }
.dui-speed-results-meta { display:flex; gap:6px 12px; flex-wrap:wrap; align-items:center; font-size:12px; }
.dui-speed-results-meta time,.dui-speed-result-mode { opacity:.65; }
.dui-speed-results { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; }
.dui-speed-card { min-width:0; border:1px solid rgba(128,128,128,.2); border-radius:12px; padding:16px; background:rgba(128,128,128,.02); }
.dui-speed-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.dui-speed-tag { min-width:0; overflow-wrap:anywhere; font-weight:500; }
.dui-speed-status { display:inline-flex; flex-shrink:0; gap:5px; align-items:center; border:1px solid currentColor; border-radius:20px; padding:2px 8px; font-size:11px; line-height:18px; }
.dui-speed-status.is-success,.dui-speed-status.is-active { color:#008771; background:rgba(0,135,113,.06); }
.dui-speed-status.is-warning { color:#9a6500; background:rgba(208,149,43,.08); }
.dui-speed-status.is-danger { color:#c93645; background:rgba(201,54,69,.06); }
.dui-speed-status.is-neutral { opacity:.65; }
.dark .dui-speed-status.is-success,.dark .dui-speed-status.is-active { color:#42cbb0; }
.dark .dui-speed-status.is-warning { color:#e8b65c; }
.dark .dui-speed-status.is-danger { color:#ee8791; }
.dui-speed-card-body { padding:14px 0; }
.dui-speed-number-label { font-size:12px; opacity:.65; }
.dui-speed-number { font-size:32px; line-height:1.4; font-weight:500; letter-spacing:-.5px; font-variant-numeric:tabular-nums; color:#008771; }
.dark .dui-speed-number { color:#42cbb0; }
.dui-speed-card.is-warning .dui-speed-number { color:#9a6500; }
.dark .dui-speed-card.is-warning .dui-speed-number { color:#e8b65c; }
.dui-speed-card.is-danger .dui-speed-number { color:inherit; opacity:.6; }
.dui-speed-number small { font-size:12px; font-weight:400; letter-spacing:0; margin-left:4px; }
.dui-speed-metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px; font-variant-numeric:tabular-nums; }
.dui-speed-metrics span { display:block; font-size:12px; opacity:.65; margin-bottom:4px; }
.dui-speed-metrics strong { display:block; font-size:14px; font-weight:500; overflow-wrap:anywhere; }
.dui-speed-metrics small { font-size:11px; font-weight:400; opacity:.65; }
.dui-speed-progress-label { display:flex; justify-content:space-between; gap:8px; font-size:11px; opacity:.7; }
.dui-speed-progress .ant-progress { display:block; line-height:1; margin-top:5px; }
.dui-speed-card-note { display:flex; align-items:flex-start; gap:6px; margin-top:10px; font-size:12px; line-height:1.6; color:#9a6500; }
.dui-speed-card-note .anticon { margin-top:3px; flex-shrink:0; }
.dark .dui-speed-card-note { color:#e8b65c; }
.dui-speed-error { margin-top:12px; }
@media(max-width:1100px){
 .dui-speed-fields { grid-template-columns:minmax(180px,1fr) 104px auto; }
 .dui-speed-outbounds { grid-column:1 / -1; }
}
@media(max-width:767px){
 .dui-speed-panel { padding:14px; }
 .dui-speed-fields { grid-template-columns:minmax(0,1fr) 92px; gap:14px 10px; }
 .dui-speed-outbounds,.dui-speed-actions { grid-column:1 / -1; }
 .dui-speed-actions { display:grid; grid-template-columns:minmax(0,1fr); }
 .dui-speed-actions.is-running { grid-template-columns:1fr 1fr; }
 .dui-speed-actions .ant-btn { min-height:40px; width:100%; }
 .dui-speed-mode .ant-radio-button-wrapper { padding:0 8px; font-size:12px; }
 .dui-speed-results { grid-template-columns:minmax(0,1fr); }
 .dui-speed-results-head { align-items:flex-start; }
 .dui-speed-card { padding:14px; }
 .dui-speed-card-head { flex-wrap:wrap; }
 .dui-speed-metrics { gap:8px; }
}

.dui-speed-modal .ant-modal { top:32px; max-width:calc(100vw - 24px); padding-bottom:24px; }
.dui-speed-modal .ant-modal-body { padding:0; max-height:calc(100vh - 180px); max-height:calc(100dvh - 180px); overflow-y:auto; overscroll-behavior:contain; }
.dui-speed-modal .dui-speed-panel { margin:0; padding:20px; border:0; border-radius:0; color:inherit; }
.dui-speed-modal .dui-speed-fields { grid-template-columns:minmax(0,1fr) 104px auto; }
.dui-speed-modal .dui-speed-outbounds { grid-column:1/-1; }
.dui-speed-modal .dui-speed-results { grid-template-columns:minmax(0,1fr); }
.dui-speed-transfer-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:18px; }
.dui-speed-transfer { min-width:0; }
.dui-speed-transfer+.dui-speed-transfer { border-left:1px solid rgba(128,128,128,.2); padding-left:20px; }
.dui-speed-transfer-heading { display:flex; gap:6px; align-items:center; margin-bottom:12px; }
.dui-speed-transfer-heading strong { font-size:13px; font-weight:500; }
.dui-speed-transfer-heading > span { margin-left:auto; font-size:11px; opacity:.65; }
.dui-speed-modal .dui-speed-metrics { margin:12px 0; padding:0; border:0; }
.dui-speed-ping { display:flex; gap:20px; align-items:center; border-top:1px solid rgba(128,128,128,.18); margin-top:16px; padding-top:16px; }
.dui-speed-ping-main { min-width:140px; }
.dui-speed-modal .dui-speed-ping-metrics { flex:1; grid-template-columns:repeat(5,minmax(0,1fr)); }
.dui-speed-ping-value { font-size:27px; }
.dui-speed-ping-help { margin:8px 0 0; font-size:11px; }
.dui-speed-modal .dui-speed-actions .ant-btn[disabled] { opacity:.45; color:inherit !important; background:rgba(128,128,128,.08) !important; border-color:rgba(128,128,128,.25) !important; }
.dui-speed-background { margin-right:12px; font-size:12px; opacity:.65; }
@media(max-width:767px){
 .dui-speed-modal .ant-modal { top:12px; max-width:calc(100vw - 16px); margin:0 auto; }
 .dui-speed-modal .ant-modal-body { max-height:calc(100vh - 150px); max-height:calc(100dvh - 150px); }
 .dui-speed-modal .dui-speed-panel { padding:14px; }
 .dui-speed-modal .dui-speed-fields { grid-template-columns:minmax(0,1fr) 88px; }
 .dui-speed-transfer-grid { gap:12px; }
 .dui-speed-transfer+.dui-speed-transfer { padding-left:12px; }
 .dui-speed-transfer-heading { flex-wrap:wrap; }
 .dui-speed-transfer-heading > span { flex-basis:100%; margin:0; }
 .dui-speed-modal .dui-speed-number { font-size:24px; }
 .dui-speed-transfer .dui-speed-metrics { grid-template-columns:1fr; gap:8px; }
 .dui-speed-transfer .dui-speed-metrics div { display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap; }
 .dui-speed-ping { display:block; }
 .dui-speed-modal .dui-speed-ping-metrics { grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
 .dui-speed-background { display:block; margin:0 0 8px; }
}
</style>
<script type="text/x-template" id="dui-outbound-speedtest-template">
<section class="dui-speed">
 <a-button :aria-label="text.title" icon="dashboard" :aria-expanded="expanded ? 'true' : 'false'" @click="open()">[[ text.title ]]<a-icon v-if="running" type="loading" /></a-button>
 <a-modal :visible="expanded" :title="text.title" :width="960" :wrap-class-name="'dui-speed-modal '+theme" :destroy-on-close="true" :mask-closable="false" @cancel="close">
 <div class="dui-speed-panel">
  <div class="dui-speed-head">
   <div class="dui-speed-heading"><h3>[[ text.route ]]</h3></div>
   <a-button :aria-label="text.refresh" size="small" icon="reload" :loading="loading" @click="refresh">[[ text.refresh ]]</a-button>
  </div>
  <p class="dui-speed-hint">[[ text.hint ]]</p>
  <a-alert v-if="dirty" type="info" show-icon :message="text.saved" style="margin-bottom:14px"></a-alert>
  <div class="dui-speed-fields">
   <div class="dui-speed-field dui-speed-outbounds">
    <label for="dui-speed-tags">[[ text.outbounds ]]</label>
    <a-select id="dui-speed-tags" v-model="selected" mode="multiple" :disabled="running || busy" :max-tag-count="3" :get-popup-container="popupParent" :placeholder="text.outbounds" :aria-label="text.outbounds" option-filter-prop="children">
     <a-select-option v-for="item in catalog" :key="item.tag" :value="item.tag">[[ item.tag ]]</a-select-option>
    </a-select>
   </div>
   <div class="dui-speed-field">
    <label>[[ text.mode ]]</label>
    <a-radio-group class="dui-speed-mode" v-model="mode" :disabled="running || busy">
     <a-radio-button value="single">[[ text.single ]]</a-radio-button><a-radio-button value="multi">[[ text.multi ]]</a-radio-button>
    </a-radio-group>
   </div>
   <div class="dui-speed-field">
    <label for="dui-speed-threads">[[ text.threads ]]</label>
    <a-select id="dui-speed-threads" :get-popup-container="popupParent" :value="mode==='single'?1:threads" @change="threads=$event" :disabled="mode==='single' || running || busy" :aria-label="text.threads">
     <a-select-option v-if="mode==='single'" :value="1">1</a-select-option>
     <a-select-option v-else v-for="n in 15" :key="n+1" :value="n+1">[[ n+1 ]]</a-select-option>
    </a-select>
   </div>
   <div class="dui-speed-actions" :class="{'is-running':running}">
    <a-button :aria-label="text.start" type="primary" icon="play-circle" :loading="busy && !running" :disabled="running || loading || dirty || !selected.length || selected.length > 10" @click="start">[[ text.start ]]</a-button>
    <a-button :aria-label="text.stop" v-if="running" icon="stop" :loading="job.state === 'stopping'" :disabled="job.state === 'stopping'" @click="stop">[[ text.stop ]]</a-button>
   </div>
  </div>
  <div class="dui-speed-selection-note dui-speed-hint"><span>[[ text.empty ]]</span><span class="dui-speed-selection-count">[[ text.selected ]] [[ selected.length ]]/10</span></div>
  <a-alert v-if="error" class="dui-speed-error" type="warning" show-icon :message="text[error] || text.error"></a-alert>
  <section v-if="job.rows.length" class="dui-speed-results-section">
   <div class="dui-speed-results-head">
    <strong>[[ text.results ]]</strong>
    <div class="dui-speed-results-meta">
     <time v-if="job.startedAt">[[ formatTime(job.startedAt) ]]</time>
     <span class="dui-speed-result-mode">[[ job.threads===1 ? text.single : text.multi+' · '+job.threads+' '+text.threads ]]</span>
     <span class="dui-speed-status" :class="'is-'+tone(resultState)"><a-icon :type="statusIcon(resultState)" />[[ text[resultState] || resultState ]]</span>
    </div>
   </div>
   <div class="dui-speed-results" :class="{'is-single':job.rows.length===1}" aria-live="polite" aria-atomic="false">
    <article v-for="row in job.rows" :key="row.tag" class="dui-speed-card" :class="'is-'+tone(row.state)">
     <div class="dui-speed-card-head"><span class="dui-speed-tag">[[ row.tag ]]</span><span class="dui-speed-status" :class="'is-'+tone(row.state)"><a-icon :type="statusIcon(row.state)" />[[ text[row.phase] || text[row.state] || row.state ]]</span></div>
     <div class="dui-speed-transfer-grid">
      <section v-for="direction in ['download','upload']" :key="direction" class="dui-speed-transfer">
       <div class="dui-speed-transfer-heading"><a-icon :type="direction==='download'?'download':'upload'" /><strong>[[ text[direction] ]]</strong><span>[[ text[measurement(row,direction).state] || text.queued ]]</span></div>
       <div class="dui-speed-number-label">[[ text.average ]]</div>
       <div class="dui-speed-number">[[ measurement(row,direction).bytes ? rate(measurement(row,direction).mbps) : '—' ]] <small>Mbps</small></div>
       <div class="dui-speed-metrics">
        <div><span>[[ text.current ]]</span><strong class="dui-speed-live">[[ measurement(row,direction).state==='testing' ? rate(measurement(row,direction).currentMbps) : '—' ]] <small>Mbps</small></strong></div>
        <div><span>[[ text[direction==='download'?'traffic':'uploaded'] ]]</span><strong>[[ (measurement(row,direction).bytes/1048576).toFixed(2) ]] <small>MiB</small></strong></div>
        <div><span>[[ text.elapsed ]]</span><strong>[[ Number(measurement(row,direction).seconds||0).toFixed(1) ]] <small>s</small></strong></div>
       </div>
       <div class="dui-speed-progress">
        <div class="dui-speed-progress-label"><span>[[ text.progress ]]</span><span>[[ measurement(row,direction).progress ]]%</span></div>
        <a-progress :percent="measurement(row,direction).progress" :show-info="false" :status="measurement(row,direction).state==='testing'?'active':'normal'" :stroke-color="progressColor(measurement(row,direction).state)" :stroke-width="5" />
       </div>
       <div v-if="measurement(row,direction).limitReached" class="dui-speed-hint">[[ text.limit ]]</div>
       <div v-if="measurement(row,direction).error" class="dui-speed-card-note"><a-icon type="info-circle" /><span>[[ text[measurement(row,direction).error] || text.error ]]</span></div>
      </section>
     </div>
     <section class="dui-speed-ping">
      <div class="dui-speed-ping-main">
       <div class="dui-speed-number-label">[[ running && row.phase ? text.pingLive : text.pingLast ]]</div>
       <div class="dui-speed-number dui-speed-ping-value">[[ row.ping && row.ping.state==='failed' ? text.failed : row.ping && row.ping.samples ? rate(row.ping.currentMs) : '—' ]] <small v-if="row.ping && row.ping.samples && row.ping.state!=='failed'">ms</small></div>
      </div>
      <div class="dui-speed-metrics dui-speed-ping-metrics">
       <div v-for="metric in ['averageMs','minMs','maxMs','jitterMs']" :key="metric"><span>[[ text[metric] ]]</span><strong>[[ row.ping && row.ping.samples ? rate(row.ping[metric]) : '—' ]] <small>ms</small></strong></div>
       <div><span>[[ text.pingFailures ]]</span><strong>[[ row.ping ? row.ping.failures : 0 ]] / [[ row.ping ? row.ping.samples+row.ping.failures : 0 ]]</strong></div>
      </div>
     </section>
     <p class="dui-speed-hint dui-speed-ping-help">[[ text.pingHint ]]</p>
     <div v-if="row.error" class="dui-speed-card-note"><a-icon type="info-circle" /><span>[[ text[row.error] || text.error ]]</span></div>
    </article>
   </div>
  </section>
 </div>
 <template slot="footer"><span v-if="running" class="dui-speed-background">[[ text.background ]]</span><a-button :aria-label="text.close" @click="close">[[ text.close ]]</a-button></template>
 </a-modal>
</section>
</script>
<script>
Vue.component('dui-outbound-speedtest',{
 template:'#dui-outbound-speedtest-template',delimiters:['[[',']]'],props:{dirty:{type:Boolean,default:false},theme:{type:String,default:''}},
 data(){return{expanded:false,lang:LanguageManager.getLanguage(),catalog:[],selected:[],mode:'single',threads:4,job:{state:'idle',rows:[]},error:'',busy:false,loading:false,timer:null,disposed:false,statusRequest:0,openRequest:0}},
 computed:{
  text(){return DuiSpeedTestI18n.get(this.lang)},
  running(){return ['running','stopping'].includes(this.job.state)},
  resultState(){
   if(this.job.state!=='done')return this.job.state;
   if(this.job.rows.length&&this.job.rows.every(r=>r.state==='failed'))return 'failed';
   if(this.job.rows.some(r=>r.state==='partial'||r.state==='failed'))return 'partial';
   return 'done';
  }
 },
 mounted(){this.poll()},
 beforeDestroy(){this.disposed=true;this.statusRequest++;clearTimeout(this.timer)},
 methods:{
  rate(n){return Number(n||0).toFixed(2)},
  formatTime(t){return new Date(t).toLocaleString(this.lang,{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})},
  tone(state){return state==='done'?'success':state==='partial'?'warning':state==='failed'?'danger':['running','testing','connecting','preparing','stopping'].includes(state)?'active':'neutral'},
  statusIcon(state){return state==='done'?'check-circle':['partial','failed'].includes(state)?'exclamation-circle':['running','testing','preparing','connecting','stopping'].includes(state)?'loading':state==='cancelled'?'stop':'clock-circle'},
  progressColor(state){return state==='partial'?'#d09b3b':state==='failed'?'#d65b69':state==='cancelled'?'#8b929a':'#008771'},
  popupParent(node){return node.parentNode},
  close(){this.expanded=false;this.openRequest++},
  measurement(row,direction){return row[direction] || (direction==='download'?row:{state:'queued',bytes:0,seconds:0,progress:0})},
  async open(tag){
   const request=++this.openRequest;this.expanded=true;
   if(tag&&!this.running)this.selected=[];
   const ok=await this.refresh();
   if(this.disposed||request!==this.openRequest||!this.expanded||!ok)return;
   if(!this.running && tag){
    if(this.catalog.some(o=>o.tag===tag))this.selected=[tag];
    else {this.selected=[];this.error='unsupported_outbound'}
   }
  },
  fail(msg){const code=String(msg?.msg||'').match(/(?:busy|download_failed|stream_failed|worker_start|unsupported_outbound|missing_outbound|invalid_request|core_unavailable|stale_job|config_unavailable|invalid_config|invalid_chain|duplicate_tag)/);this.error=code?code[0]:'error'},
  async refresh(){
   this.loading=true;
   try{const r=await HttpUtil.get('/dui/xray/speedTest/catalog');if(this.disposed)return;
    if(r.success&&Array.isArray(r.obj)){this.catalog=r.obj;this.selected=this.selected.filter(tag=>this.catalog.some(o=>o.tag===tag))}
    else {this.fail(r);return false}
    await this.poll();return !this.error;
   }catch(_){this.error='error';return false}finally{if(!this.disposed)this.loading=false}
  },
  async poll(){
   clearTimeout(this.timer);const request=++this.statusRequest;
   try{
    const r=await HttpUtil.get('/dui/xray/speedTest/status');
    if(this.disposed||request!==this.statusRequest)return;
    if(r.success&&r.obj){this.job=r.obj;this.error='';}else this.fail(r);
   }catch(_){if(!this.disposed&&request===this.statusRequest)this.error='error'}
   finally{
    if(!this.disposed&&request===this.statusRequest&&(this.running||this.error))this.timer=setTimeout(()=>this.poll(),this.error?3000:1000);
   }
  },
  async start(){
   if(this.busy||this.running||this.dirty)return;
   this.busy=true;this.error='';this.statusRequest++;clearTimeout(this.timer);
   try{
    const r=await HttpUtil.post('/dui/xray/speedTest/start',{request:JSON.stringify({tags:this.selected,threads:this.mode==='single'?1:this.threads})});
    if(this.disposed)return;
    if(r.success&&r.obj){this.job=r.obj;await this.poll()}else{this.fail(r);if(this.error==='busy')await this.poll()}
   }catch(_){this.error='error';await this.poll()}
   finally{if(!this.disposed)this.busy=false}
  },
  async stop(){
   if(this.busy||!this.running)return;this.busy=true;this.statusRequest++;clearTimeout(this.timer);
   try{const r=await HttpUtil.post('/dui/xray/speedTest/cancel',{id:this.job.id});if(this.disposed)return;
    if(r.success&&r.obj)this.job=r.obj;else this.fail(r);await this.poll();
   }catch(_){this.error='error';await this.poll()}finally{if(!this.disposed)this.busy=false}
  }
 }
});
</script>
