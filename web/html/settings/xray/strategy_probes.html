{{define "settings/xray/strategyProbesComponent"}}
<style>
.dui-probes { width:100%; min-width:0; margin-top:16px; }
.dui-probes h3 { color:inherit; }
.dui-probes .dui-probe-accordion { margin-top:16px; }
.dui-probe-enable { margin:16px 0; }
.dui-probe-enable-row { display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
.dui-probe-enable-row label { font-weight:500; }
.dui-probe-form { max-width:900px; }
.dui-probe-field { margin:16px 0; }
.dui-probe-field > label { display:block; font-weight:500; margin-bottom:6px; }
.dui-probe-help { font-size:12px; opacity:.7; margin-top:6px; overflow-wrap:anywhere; }
.dui-probe-targets { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0; }
.dui-probe-targets .ant-tag { max-width:100%; white-space:normal; overflow-wrap:anywhere; }
.dui-probe-json { font-family:monospace; direction:ltr; }
.dui-probe-history { margin-top:24px; min-width:0; }
.dui-probe-history .ant-table { overflow-wrap:anywhere; }
.dui-probe-history .ant-select { width:240px; max-width:100%; }
.dui-probe-actions { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
</style>
<script type="text/x-template" id="dui-strategy-probes-template">
<div class="dui-probes">
    <h3>[[ text.title ]]</h3>
    <a-alert type="info" show-icon :message="text.sharingHelp"></a-alert>
    <a-collapse class="dui-probe-accordion" accordion :active-key="expanded" @change="expandStrategy">
        <a-collapse-panel v-for="type in types" :key="type" :header="text[type]">
          <div v-if="expanded === type">

    <p class="dui-probe-help" v-if="(!value.strategyObservatory || !value.strategyObservatory[active]) && (active==='outbound' || targets.length)">[[ active === 'outbound' ? text.outboundHelp : text.legacy ]]</p>
    <section v-if="active==='outbound'" class="dui-probe-enable">
        <div class="dui-probe-enable-row">
            <label for="probe-enabled-outbound">[[ text.enableProbe ]]</label>
            <button id="probe-enabled-outbound" type="button" class="ant-switch" :aria-label="text.enableProbe"
                role="switch" :aria-checked="String(outboundEnabled)"
                :class="{'ant-switch-checked':outboundEnabled,'ant-switch-disabled':!!errors.outbound || rawDirty.outbound || (outboundEnabled && fallbackRequired)}"
                :disabled="!!errors.outbound || rawDirty.outbound || (outboundEnabled && fallbackRequired)"
                @click="setOutboundEnabled(!outboundEnabled)"><span class="ant-switch-inner"></span></button>
            <a-tag :color="outboundPending ? 'orange' : (outboundEnabled ? 'green' : undefined)">[[ outboundPending ? text.pendingSave : (outboundEnabled ? text.enabledProbe : text.disabledProbe) ]]</a-tag>
        </div>
        <p class="dui-probe-help">[[ text.toggleHelp ]]</p>
        <p v-if="fallbackRequired" class="dui-probe-help">[[ text.fallbackRequired ]]</p>
        <a-alert v-if="!outboundEnabled" type="info" show-icon :message="text.disabledHelp"></a-alert>
        <p v-else-if="!targets.length" class="dui-probe-help">[[ text.outboundUnused ]]</p>
    </section>
    <div><strong>[[ text.targets ]]</strong></div>
    <div class="dui-probe-targets">
        <a-tag v-for="tag in targets" :key="tag">[[ tag ]]</a-tag>
        <span v-if="!targets.length" class="dui-probe-help">[[ active === 'outbound' ? text.outboundUnused : text.unused ]]</span>
    </div>
    <div class="dui-probe-actions">
        <a-checkbox v-model="advanced[active]">[[ text.advanced ]]</a-checkbox>
    </div>
    <div v-if="advanced[active]">
        <a-textarea class="dui-probe-json" :aria-label="text.advanced" v-model="raw[active]" @input="rawChange" :rows="13"></a-textarea>
        <div class="dui-probe-actions">
            <a-button type="primary" @click="applyRaw">[[ text.apply ]]</a-button>
            <a-button @click="resetRaw">[[ text.reset ]]</a-button>
        </div>
    </div>
    <div v-else class="dui-probe-form">
        <div class="dui-probe-field">
            <label :for="'probe-url-'+active">[[ text.destination ]]</label>
            <a-input v-if="active==='leastPing'" :id="'probe-url-'+active" v-model.trim="current.probeURL" @input="formChange"></a-input>
            <a-input v-else :id="'probe-url-'+active" v-model.trim="current.pingConfig.destination" @input="formChange"></a-input>
        </div>
        <div class="dui-probe-field">
            <label :for="'probe-interval-'+active">[[ text.interval ]]</label>
            <a-input v-if="active==='leastPing'" :id="'probe-interval-'+active" v-model.trim="current.probeInterval" @input="formChange" placeholder="1m"></a-input>
            <a-input v-else :id="'probe-interval-'+active" v-model.trim="current.pingConfig.interval" @input="formChange" placeholder="1m"></a-input>
            <div class="dui-probe-help">[[ text.units ]]</div>
            <div v-if="active!=='leastPing'" class="dui-probe-help">[[ text.burstHint ]]</div>
        </div>
        <div v-if="active==='leastPing'" class="dui-probe-field">
            <label :for="'probe-concurrent-'+active">[[ text.concurrent ]]</label>
            <a-switch :id="'probe-concurrent-'+active" :aria-label="text.concurrent" v-model="current.enableConcurrency" @change="formChange"></a-switch>
            <div class="dui-probe-help">[[ text.concurrencyHint ]]</div>
        </div>
        <template v-else>
            <div class="dui-probe-field">
                <label :for="'probe-timeout-'+active">[[ text.timeout ]]</label>
                <a-input :id="'probe-timeout-'+active" v-model.trim="current.pingConfig.timeout" @input="formChange" placeholder="10s"></a-input>
            </div>
            <div class="dui-probe-field">
                <label :for="'probe-sampling-'+active">[[ text.sampling ]]</label>
                <a-input-number :id="'probe-sampling-'+active" v-model="current.pingConfig.sampling" :min="1" :max="1000" :precision="0" @change="formChange"></a-input-number>
                <div class="dui-probe-help">[[ text.samplingHint ]]</div>
            </div>
            <div class="dui-probe-field">
                <label :for="'probe-connectivity-'+active">[[ text.connectivity ]]</label>
                <a-input :id="'probe-connectivity-'+active" v-model.trim="current.pingConfig.connectivity" @input="formChange"></a-input>
                <div class="dui-probe-help">[[ text.connectivityHint ]]</div>
            </div>
        </template>
    </div>
    <a-alert v-if="errors[active] && errors[active]!=='pending'" type="error" show-icon :message="text.invalid"></a-alert>
    <a-alert v-if="rawDirty[active]" type="warning" show-icon :message="text.apply + ' · ' + text.saveHint"></a-alert>
    <p class="dui-probe-help">[[ text.saveHint ]]</p>
    <section class="dui-probe-history">
        <a-button @click="toggleHistory" :aria-expanded="showHistory">[[ text.history ]]</a-button>
        <template v-if="showHistory">
            <p class="dui-probe-help">[[ text.retention ]]</p>
            <div class="dui-probe-actions">
                <a-select v-model="historyTag" :aria-label="text.targets" @change="loadHistory(1)">
                    <a-select-option value="">[[ text.allOutbounds ]]</a-select-option>
                    <a-select-option v-for="tag in history.tags" :key="tag" :value="tag">[[ tag ]]</a-select-option>
                </a-select>
                <a-button :loading="historyLoading" @click="loadHistory(history.page)">[[ text.refreshHistory ]]</a-button>
            </div>
            <a-alert v-if="historyError || (history.state && history.state!=='ok')" type="warning" show-icon
                :message="history.state==='unsupported' ? text.unsupportedHistory : text.unavailableHistory"></a-alert>
            <a-alert v-if="history.gap" type="warning" show-icon :message="text.historyGap"></a-alert>
            <a-table :columns="historyColumns" :data-source="history.rows" row-key="id" :pagination="false"
                :loading="historyLoading" :scroll="{x:540}" :locale="{emptyText:historyEmpty}" size="small">
                <template slot="time" slot-scope="value">[[ formatProbeTime(value) ]]</template>
                <template slot="outbound" slot-scope="value,row">
                    <span>[[ value ]]</span>
                </template>
                <template slot="status" slot-scope="value"><a-tag :color="value==='success' ? 'green' : (value==='failed' ? 'red' : 'orange')">[[ text[value] ]]</a-tag></template>
                <template slot="delay" slot-scope="value,row">[[ row.status==='success' ? Number(value).toFixed(1)+' ms' : '—' ]]</template>
            </a-table>
            <div class="dui-probe-actions">
                <a-button :disabled="historyLoading || history.page<=1" @click="loadHistory(history.page-1)">[[ text.previousHistory ]]</a-button>
                <span>[[ history.page ]] / [[ Math.max(1,Math.ceil(history.total/50)) ]]</span>
                <a-button :disabled="historyLoading || history.page*50>=history.total" @click="loadHistory(history.page+1)">[[ text.nextHistory ]]</a-button>
            </div>
        </template>
    </section>
          </div>
        </a-collapse-panel>
    </a-collapse>
</div>
</script>
<script>
Vue.component('dui-strategy-probes', {
    template: '#dui-strategy-probes-template',
    delimiters: ['[[', ']]'],
    props: {value: {type:Object, required:true}, savedValue:{type:Object,default:()=>({})}},
    data() {
        const types = DuiStrategyProbes.types;
        const drafts={}, raw={}, rawDirty={}, errors={}, advanced={};
        for (const type of types) {
            drafts[type]=DuiStrategyProbes.read(this.value,type);
            raw[type]=JSON.stringify(drafts[type],null,2);
            rawDirty[type]=false; errors[type]=''; advanced[type]=false;
        }
        return {types, expanded:'',active:types.find(type=>DuiStrategyProbes.selectors(this.value,type).length)||'leastPing',
            lang:LanguageManager.getLanguage(), drafts,raw,rawDirty,errors,advanced,
            showHistory:false,historyLoading:false,historyError:false,historyTag:'',historyRequest:0,
            history:{rows:[],tags:[],total:0,page:1,state:'',gap:false}};
    },
    beforeDestroy() {this.historyRequest++;this.$emit('validity',true)},
    computed: {
        text() {return DuiProbeI18n.get(this.lang)},
        outboundEnabled() {return DuiStrategyProbes.enabled(this.value,'outbound')},
        fallbackRequired() {return DuiStrategyProbes.fallbackRequired(this.value)},
        outboundPending() {
            return ['strategyObservatory','duiDisabledProbes'].some(key =>
                JSON.stringify(this.value[key]?.outbound) !== JSON.stringify(this.savedValue[key]?.outbound));
        },
        historyEmpty() {return this.active==='outbound' && !this.outboundEnabled ? this.text.disabledHelp : this.text.waitingProbe},
        historyColumns() {return [
            {title:this.text.probeTime,dataIndex:'time',width:175,scopedSlots:{customRender:'time'}},
            {title:this.text.targets,dataIndex:'outbound',width:165,scopedSlots:{customRender:'outbound'}},
            {title:this.text.probeStatus,dataIndex:'status',width:140,scopedSlots:{customRender:'status'}},
            {title:this.text.probeDelay,dataIndex:'delay',width:90,scopedSlots:{customRender:'delay'}}
        ]},
        current() {return this.drafts[this.active]},
        targets() {return DuiStrategyProbes.selectors(this.value,this.active)}
    },
    watch: {
        active() {this.historyRequest++;this.historyTag='';this.history={rows:[],tags:[],total:0,page:1,state:'',gap:false};if(this.showHistory)this.loadHistory(1)},
        value: {deep:true, handler() {
            for (const type of this.types) {
                if (this.errors[type] || this.rawDirty[type]) continue;
                this.$set(this.drafts,type,DuiStrategyProbes.read(this.value,type));
                this.$set(this.raw,type,JSON.stringify(this.drafts[type],null,2));
            }
        }},
        advanced: {deep:true, handler() {this.notifyValidity()}}
    },
    methods: {
        setOutboundEnabled(on) {
            if (this.errors.outbound || this.rawDirty.outbound || (!on && this.fallbackRequired)) return;
            this.$emit('input',DuiStrategyProbes.setEnabled(this.value,on));
        },
        expandStrategy(key) {
            const next = Array.isArray(key) ? (key[0] || '') : (key || '');
            this.expanded = next;
            if (!next) { this.historyRequest++; this.historyLoading = false; return; }
            if (this.active === next) { if (this.showHistory) this.loadHistory(1); }
            else this.active = next;
        },

        toggleHistory() {this.showHistory=!this.showHistory;if(this.showHistory)this.loadHistory(1);else {this.historyRequest++;this.historyLoading=false}},
        formatProbeTime(value) {return new Date(value).toLocaleString(this.lang,{hour12:false})},
        async loadHistory(page) {
            const request=++this.historyRequest;this.historyLoading=true;this.historyError=false;
            try {
                const query=new URLSearchParams({strategy:this.active,outbound:this.historyTag,page:String(page)});
                const response=await HttpUtil.get('/dui/xray/probeHistory?'+query.toString());
                if(request!==this.historyRequest)return;
                if(!response.success||!response.obj)throw new Error('history unavailable');
                this.history=response.obj;
            } catch(_) {if(request===this.historyRequest)this.historyError=true}
            finally {if(request===this.historyRequest)this.historyLoading=false}
        },
        notifyValidity() {this.$emit('validity',this.types.every(type=>!this.errors[type]&&!this.rawDirty[type]))},
        formChange() {
            this.errors[this.active]=DuiStrategyProbes.validate(this.active,this.current);
            if (!this.errors[this.active]) {
                // A form edit intentionally replaces an unapplied JSON draft for this strategy.
                this.rawDirty[this.active]=false;
                this.raw[this.active]=JSON.stringify(this.current,null,2);
                this.$emit('input',DuiStrategyProbes.update(this.value,this.active,this.current));
            }
            this.notifyValidity();
        },
        rawChange() {this.rawDirty[this.active]=true;this.errors[this.active]='pending';this.notifyValidity()},
        applyRaw() {
            try {
                const parsed=JSON.parse(this.raw[this.active]);
                const next=DuiStrategyProbes.update(this.value,this.active,parsed);
                this.errors[this.active]='';this.rawDirty[this.active]=false;
                this.$set(this.drafts,this.active,DuiStrategyProbes.read(next,this.active));
                this.raw[this.active]=JSON.stringify(this.current,null,2);
                this.$emit('input',next);
            } catch (_) {this.errors[this.active]='invalid'}
            this.notifyValidity();
        },
        resetRaw() {
            this.raw[this.active]=JSON.stringify(DuiStrategyProbes.read(this.value,this.active),null,2);
            this.rawDirty[this.active]=false;this.errors[this.active]='';
            this.$set(this.drafts,this.active,DuiStrategyProbes.read(this.value,this.active));
            this.notifyValidity();
        }
    }
});
</script>
{{end}}
